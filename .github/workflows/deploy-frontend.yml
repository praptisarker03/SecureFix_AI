# Builds the React frontend and publishes it to GitHub Pages on every push to main.
# Site URL: https://<user>.github.io/<repo>/
#
# One-time setup in the GitHub repo:
#   Settings > Pages > Source: "GitHub Actions"
#   Settings > Secrets and variables > Actions > New repository secret:
#     VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   (same values as frontend/.env)
#   Optional: VITE_API_URL once the FastAPI backend is deployed somewhere public
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # GitHub Pages has no SPA routing: serve the app for unknown paths
      # so deep links like /SecureFix_Ai/dashboard work on refresh.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
